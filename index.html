<style>
.cam-container {
    padding: 16px;
    color: #333;
    max-height: 540px;
    overflow-y: auto;
}
.dark .cam-container { color: #ccc; }
.cam-table {
    width: 100%;
    margin-top: 10px;
    table-layout: fixed;
}
.cam-table th, .cam-table td {
    vertical-align: middle !important;
    text-align: left;
}
.cam-badge-active {
    background: #52c41a;
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
}
.cam-badge-inactive {
    background: #ff4d4f;
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
}
.cam-rtsp-pill {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 4px;
    padding: 3px 6px;
    font-family: Consolas, Menlo, Monaco, monospace;
    font-size: 11px;
    max-width: 100%;
}
.dark .cam-rtsp-pill {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.1);
}
.cam-rtsp-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    margin-right: 4px;
}
.cam-btn-copy {
    cursor: pointer;
    opacity: 0.6;
    font-size: 11px;
    padding: 0 3px;
}
.cam-btn-copy:hover {
    opacity: 1;
    color: #20a53a;
}
.cam-modal-row { margin-bottom: 12px; }
.cam-modal-row label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; }
.cam-actions-box a {
    cursor: pointer;
    display: inline-block;
    margin-right: 6px;
    font-size: 12px;
}
</style>

<div class="cam-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div>
            <button class="btn btn-success btn-sm" onclick="cameraManager.openModal(false)">➕ Thêm Camera</button>
            <button class="btn btn-default btn-sm" onclick="cameraManager.triggerArchive()">🚀 Bắn Telegram Ngay</button>
            <button class="btn btn-default btn-sm" onclick="cameraManager.reloadList()">🔄 Làm Mới</button>
        </div>
        <div>
            <span id="camPluginVersion" style="font-size: 12px; color: #888; margin-right: 8px;">v1.0.2</span>
            <button class="btn btn-default btn-sm" onclick="cameraManager.checkUpdate()">☁️ Kiểm tra Update</button>
        </div>
    </div>

    <div class="divtable">
        <table class="table table-hover cam-table" id="camListTable">
            <thead>
                <tr>
                    <th style="width: 110px;">Mã Camera</th>
                    <th>RTSP URL Stream</th>
                    <th style="width: 95px; text-align: center;">Trạng Thái</th>
                    <th style="width: 85px; text-align: center;">Đoạn Cắt</th>
                    <th style="width: 130px;">Telegram</th>
                    <th style="width: 175px;">Hành Động</th>
                </tr>
            </thead>
            <tbody id="camTableBody">
                <tr><td colspan="6" style="text-align: center; padding: 20px;">Đang tải dữ liệu camera...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="text/javascript">
var cameraManager = {
    cams: [],
    
    init: function() {
        this.expandPanelDialog();
        this.reloadList();
    },

    expandPanelDialog: function() {
        setTimeout(function() {
            try {
                var layerDom = $('.cam-container').closest('.layui-layer');
                if (layerDom.length) {
                    var winW = $(window).width();
                    var targetW = Math.min(880, winW - 40);
                    layerDom.css({
                        'width': targetW + 'px',
                        'left': ((winW - targetW) / 2) + 'px'
                    });
                    layerDom.find('.layui-layer-content').css({
                        'max-height': '600px',
                        'overflow': 'hidden'
                    });
                }
            } catch (e) {}
        }, 100);
    },

    formatRtspDisplay: function(url) {
        if (!url) return '<span style="color: #999;">(trống)</span>';
        var clean = url.replace(/\/\/([^:]+):([^@]+)@/, '//$1:***@');
        var safeFull = url.replace(/"/g, '&quot;');
        return '<div class="cam-rtsp-pill">' +
            '<span class="cam-rtsp-text" title="' + safeFull + '">' + clean + '</span>' +
            '<span class="cam-btn-copy" title="Sao chép URL" onclick="cameraManager.copyToClipboard(\'' + safeFull + '\')">📋</span>' +
        '</div>';
    },

    copyToClipboard: function(text) {
        var $temp = $('<textarea>');
        $('body').append($temp);
        $temp.val(text).select();
        document.execCommand('copy');
        $temp.remove();
        layer.msg('Đã sao chép RTSP URL!', { icon: 1, time: 1500 });
    },

    reloadList: function() {
        var loadT = layer.msg('Đang tải dữ liệu...', { icon: 16, time: 0, shade: 0.1 });
        $.post('/plugin?action=a&name=camera_manager&s=get_camera_list', {}, function(res) {
            layer.close(loadT);
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            cameraManager.cams = data;
            cameraManager.renderTable(data);
        }).fail(function() {
            layer.close(loadT);
            layer.msg('Không thể tải danh sách camera', { icon: 2 });
        });
    },

    renderTable: function(list) {
        var tbody = $('#camTableBody');
        tbody.empty();
        if (!list || list.length === 0) {
            tbody.append('<tr><td colspan="6" style="text-align: center; color: #999; padding: 25px;">Chưa có camera nào được cấu hình. Bấm "Thêm Camera" để bắt đầu.</td></tr>');
            return;
        }

        $.each(list, function(idx, item) {
            var isActive = (item.status === 'active');
            var statusBadge = isActive ? '<span class="cam-badge-active">Đang quay</span>' : '<span class="cam-badge-inactive">Đã dừng</span>';
            var teleText = item.telegram_bot_token ? '<span title="' + (item.telegram_chat_id || '') + '">✅ ' + (item.telegram_chat_id ? item.telegram_chat_id : 'Bot') + '</span>' : '<span style="color: #999;">Chưa có</span>';
            var segMin = Math.round((parseInt(item.segment_time || 180) / 60) * 10) / 10;

            var actBtn = '<div class="cam-actions-box">';
            if (isActive) {
                actBtn += '<a class="btlink" style="color: #ff4d4f;" onclick="cameraManager.control(\'' + item.id + '\', \'stop\')">⏹ Dừng</a>';
            } else {
                actBtn += '<a class="btlink" style="color: #52c41a;" onclick="cameraManager.control(\'' + item.id + '\', \'start\')">▶ Chạy</a>';
            }
            actBtn += '<a class="btlink" onclick="cameraManager.control(\'' + item.id + '\', \'restart\')">🔄 Restart</a>';
            actBtn += '<a class="btlink" onclick="cameraManager.openModal(true, \'' + item.id + '\')">✏ Sửa</a>';
            actBtn += '<a class="btlink" style="color: #ff4d4f;" onclick="cameraManager.deleteCam(\'' + item.id + '\')">🗑 Xóa</a>';
            actBtn += '</div>';

            var tr = '<tr>' +
                '<td><b>' + item.id + '</b></td>' +
                '<td>' + cameraManager.formatRtspDisplay(item.rtsp_url) + '</td>' +
                '<td style="text-align: center;">' + statusBadge + '</td>' +
                '<td style="text-align: center;">' + segMin + ' phút</td>' +
                '<td>' + teleText + '</td>' +
                '<td>' + actBtn + '</td>' +
            '</tr>';
            tbody.append(tr);
        });
    },

    control: function(camId, act) {
        var loadT = layer.msg('Đang xử lý...', { icon: 16, time: 0, shade: 0.1 });
        $.post('/plugin?action=a&name=camera_manager&s=control_service', { id: camId, act: act }, function(res) {
            layer.close(loadT);
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.status) {
                layer.msg(data.msg, { icon: 1, time: 1500 });
                cameraManager.reloadList();
            } else {
                layer.msg(data.msg || 'Thất bại', { icon: 2 });
            }
        });
    },

    triggerArchive: function() {
        var loadT = layer.msg('Đang kiểm tra và gửi video...', { icon: 16, time: 0, shade: 0.1 });
        $.post('/plugin?action=a&name=camera_manager&s=trigger_archive', {}, function(res) {
            layer.close(loadT);
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            layer.msg(data.msg || 'Đã gửi lệnh quét video', { icon: 1 });
        });
    },

    deleteCam: function(camId) {
        layer.confirm('Bạn có chắc chắn muốn xóa camera [' + camId + ']?', { title: 'Xác nhận xóa', icon: 3 }, function() {
            var loadT = layer.msg('Đang xóa...', { icon: 16, time: 0, shade: 0.1 });
            $.post('/plugin?action=a&name=camera_manager&s=delete_camera', { id: camId }, function(res) {
                layer.close(loadT);
                var data = (typeof res === 'string') ? JSON.parse(res) : res;
                if (data.status) {
                    layer.msg(data.msg, { icon: 1 });
                    cameraManager.reloadList();
                } else {
                    layer.msg(data.msg || 'Không thể xóa', { icon: 2 });
                }
            });
        });
    },

    openModal: function(isEdit, camId) {
        var c = isEdit ? cameraManager.cams.find(function(x) { return x.id === camId; }) : null;
        var html = '<div style="padding: 16px 20px; max-height: 520px; overflow-y: auto;">' +
            '<div class="cam-modal-row">' +
                '<label>Mã Camera (ID - viết liền không dấu):</label>' +
                '<input class="bt-input-text" id="m_cam_id" style="width: 100%;" value="' + (c ? c.id : '') + '" ' + (isEdit ? 'disabled' : '') + ' placeholder="ví dụ: cong_truoc, san, xuong, phong_khach" />' +
            '</div>' +
            '<div class="cam-modal-row">' +
                '<label>RTSP Stream URL:</label>' +
                '<div style="display: flex; gap: 8px;">' +
                    '<input class="bt-input-text" id="m_rtsp_url" style="flex: 1;" value="' + (c ? c.rtsp_url : '') + '" placeholder="rtsp://admin:pass@192.168.1.x:554/..." />' +
                    '<button class="btn btn-default btn-sm" onclick="cameraManager.testStream()">Test Stream</button>' +
                '</div>' +
                '<div id="m_test_res" style="font-size: 11px; margin-top: 4px;"></div>' +
            '</div>' +
            '<div style="display: flex; gap: 12px;" class="cam-modal-row">' +
                '<div style="flex: 1;">' +
                    '<label>Thời lượng mỗi đoạn video (Giây):</label>' +
                    '<input type="number" class="bt-input-text" id="m_segment_time" style="width: 100%;" value="' + (c ? c.segment_time : '180') + '" placeholder="180 (3 phút)" />' +
                    '<div style="font-size: 11px; color: #888; margin-top: 3px;">Khuyên dùng: 180s (3 phút) hoặc 240s (4 phút) để file < 45MB.</div>' +
                '</div>' +
                '<div style="flex: 1;">' +
                    '<label>Audio Mode:</label>' +
                    '<select class="bt-input-text" id="m_audio_mode" style="width: 100%;">' +
                        '<option value="aac" ' + (c && c.audio_mode === 'aac' ? 'selected' : '') + '>AAC Encode (Chuẩn Telegram)</option>' +
                        '<option value="copy" ' + (c && c.audio_mode === 'copy' ? 'selected' : '') + '>Copy Stream</option>' +
                    '</select>' +
                '</div>' +
            '</div>' +
            '<hr style="margin: 12px 0; border: 0; border-top: 1px dashed #ccc;" />' +
            '<div class="cam-modal-row">' +
                '<label>Telegram Bot Token (để gửi video):</label>' +
                '<input class="bt-input-text" id="m_tele_token" style="width: 100%;" value="' + (c ? c.telegram_bot_token : '') + '" placeholder="8047369133:AAE8q2QJw-..." />' +
            '</div>' +
            '<div class="cam-modal-row">' +
                '<label>Telegram Group / Chat ID:</label>' +
                '<input class="bt-input-text" id="m_tele_chat" style="width: 100%;" value="' + (c ? c.telegram_chat_id : '') + '" placeholder="-5073385944" />' +
            '</div>' +
            '<div style="text-align: right; margin-top: 16px;">' +
                '<button class="btn btn-default btn-sm" onclick="layer.close(layer.index)" style="margin-right: 8px;">Đóng</button>' +
                '<button class="btn btn-success btn-sm" onclick="cameraManager.saveForm()">Lưu Cấu Hình</button>' +
            '</div>' +
        '</div>';

        layer.open({
            type: 1,
            title: isEdit ? 'Chỉnh sửa Camera [' + camId + ']' : 'Thêm Camera Mới',
            area: ['540px', 'auto'],
            closeBtn: 2,
            shadeClose: false,
            content: html
        });
    },

    testStream: function() {
        var url = $('#m_rtsp_url').val().trim();
        if (!url) return layer.msg('Vui lòng nhập RTSP URL trước', { icon: 0 });
        $('#m_test_res').html('<span style="color: #faad14;">⏳ Đang kiểm tra luồng RTSP...</span>');
        $.post('/plugin?action=a&name=camera_manager&s=test_rtsp', { rtsp_url: url }, function(res) {
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.ok) {
                var v = (data.info && data.info.streams) ? data.info.streams.find(function(s){return s.codec_type === 'video';}) : null;
                var info = v ? (' (' + v.codec_name + ' ' + v.width + 'x' + v.height + ')') : '';
                $('#m_test_res').html('<span style="color: #52c41a;">✅ Kết nối thành công!' + info + '</span>');
            } else {
                $('#m_test_res').html('<span style="color: #ff4d4f;">❌ Lỗi: ' + (data.error || 'Thất bại') + '</span>');
            }
        });
    },

    saveForm: function() {
        var id = $('#m_cam_id').val().trim();
        var rtsp = $('#m_rtsp_url').val().trim();
        if (!id || !rtsp) return layer.msg('Vui lòng điền đủ Mã Camera và RTSP URL', { icon: 0 });

        var payload = {
            id: id,
            rtsp_url: rtsp,
            segment_time: $('#m_segment_time').val().trim() || '180',
            audio_mode: $('#m_audio_mode').val(),
            telegram_bot_token: $('#m_tele_token').val().trim(),
            telegram_chat_id: $('#m_tele_chat').val().trim()
        };

        var loadT = layer.msg('Đang lưu cấu hình...', { icon: 16, time: 0, shade: 0.1 });
        $.post('/plugin?action=a&name=camera_manager&s=save_camera', payload, function(res) {
            layer.close(loadT);
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            if (data.status) {
                layer.close(layer.index);
                layer.msg(data.msg, { icon: 1 });
                cameraManager.reloadList();
            } else {
                layer.msg(data.msg || 'Không thể lưu', { icon: 2 });
            }
        });
    },

    checkUpdate: function() {
        var loadT = layer.msg('Đang kiểm tra cập nhật...', { icon: 16, time: 0, shade: 0.1 });
        $.post('/plugin?action=a&name=camera_manager&s=check_update', {}, function(res) {
            layer.close(loadT);
            var data = (typeof res === 'string') ? JSON.parse(res) : res;
            layer.alert(data.msg || 'Bạn đang sử dụng phiên bản mới nhất (v1.0.2)', { title: 'Thông tin phiên bản', icon: 1 });
        });
    }
};

cameraManager.init();
</script>
